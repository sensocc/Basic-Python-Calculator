name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the tests
        # The real-window tests in test_gui_smoke.py skip themselves here,
        # because there is no display. The next job gives them one.
        run: python3 -m unittest discover -v

  window:
    name: Tests - with a real window
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Tk and Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb

      - name: Run the tests on a virtual display
        # xvfb-run starts a headless X server, so Tk can open a real window.
        run: xvfb-run -a python3 -m unittest discover -v
